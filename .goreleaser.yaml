version: 2

project_name: hikyaku

builds:
  - id: hikyaku-server
    main: ./cmd/hikyaku-server
    binary: hikyaku-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: hikyaku-client
    main: ./cmd/hikyaku-client
    binary: hikyaku-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - ids:
      - hikyaku-server
      - hikyaku-client
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  prerelease: auto

brews:
  - name: hikyaku
    repository:
      owner: SukkaW
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: SukkaBot
      email: "{{ .Env.HOMEBREW_GIT_MAIL }}"
    directory: Formula
    homepage: https://github.com/SukkaW/hikyaku
    description: A high-performance multiplexing proxy that stays lightning fast and highly reliable everywhere,<br />from fiber broadband to lossy in-flight Wi-Fi.
    license: MIT
    install: |
      bin.install "hikyaku-server"
      bin.install "hikyaku-client"
    test: |
      system bin/"hikyaku-server", "-genkey"
